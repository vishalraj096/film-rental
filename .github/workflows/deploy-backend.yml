name: Deploy Backend to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  JAR_NAME: backend-0.0.1-SNAPSHOT.jar
  APP_DIR: /opt/film-rental-backend
  SERVICE_NAME: film-rental-backend
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Set up JDK 17 ──
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # ── 3. Make Maven wrapper executable ──
      - name: Make mvnw executable
        working-directory: backend
        run: chmod +x mvnw

      # ── 4. Build JAR (skip tests for speed; tests should run in a separate CI job) ──
      - name: Build with Maven
        working-directory: backend
        run: ./mvnw clean package -DskipTests -B

      # ── 4. Upload JAR as artifact (for auditing / rollback) ──
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/${{ env.JAR_NAME }}
          retention-days: 5

      # ── 5. Copy JAR to EC2 via SCP ──
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BACKEND_EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: backend/target/${{ env.JAR_NAME }}
          target: /tmp/
          strip_components: 2  # removes "backend/target/" prefix

      # ── 6. Deploy on EC2 via SSH ──
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.BACKEND_EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: JAR_NAME,APP_DIR,SERVICE_NAME
          script: |
            set -e

            # Ensure app directory exists
            sudo mkdir -p $APP_DIR
            sudo chown $USER:$USER $APP_DIR

            # Move the new JAR into place
            mv /tmp/$JAR_NAME $APP_DIR/$JAR_NAME

            # Restart the systemd service
            sudo systemctl restart $SERVICE_NAME
            sudo systemctl enable $SERVICE_NAME

            # Wait a few seconds and verify it started
            sleep 5
            sudo systemctl is-active --quiet $SERVICE_NAME && echo "✅ Backend is running" || echo "❌ Backend failed to start"
