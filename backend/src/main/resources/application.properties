spring.application.name=backend

# ---- MySQL (values resolved from .env at startup by BackendApplication.main) ----
spring.datasource.url=${AMAZON_RDS_URL}
spring.datasource.username=${AMAZON_RDS_USERNAME}
spring.datasource.password=${AMAZON_RDS_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- HikariCP Connection Pool ----
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=30000

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=32
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# ---- Redis (values resolved from .env) ----
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=3000ms
spring.data.redis.ssl.enabled=true
spring.cache.type=redis

# ---- Lettuce Connection Pool (requires commons-pool2) ----
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=4
spring.data.redis.lettuce.pool.max-wait=2000ms

# DevTools' RestartClassLoader creates a separate ClassLoader for app code,
# which causes JDK-serialized cache values to fail with ClassCastException on
# every hit (cached objects come back as the "wrong" Class). Disable restart
# so the cache layer works whether launched from IntelliJ or `mvnw`.
spring.devtools.restart.enabled=false

# ---- Server Thread Pool ----
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:3000, http://16.170.215.151:8081}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=*
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

